name: owfeed package

# A reusable workflow for an author's repository: check on every push, and on a tag
# build, sign and publish a release a feed can ingest.
#
# `feed.yml` is the sibling of this file and does the same job for the other role. The
# two halves of the ecosystem had one shape between them, so every repository that
# publishes packages wrote this one out by hand — four of them, at 190 to 630 lines
# each, with `owfeed release --repo` typed out four times.
#
# WHAT THE SHAPE ENFORCES, which is the part that is easy to get wrong:
#
#   - The build job never sees a key. It runs the author's own build script, which on
#     a pull request came out of a fork. Keys appear only in the release job, which
#     runs on a tag and nowhere else.
#   - Every push gets `owfeed check`: build, sign, index and doctor against keys
#     generated for the run and discarded. The pull request exercises the same
#     pipeline as the release rather than a second one that drifts.
#   - The release is created as a DRAFT and published in a separate step. `latest`
#     moves the moment a release is published, and the upload action creates the
#     release before attaching assets — so a router polling in that window resolves
#     `releases/latest/download/manifest.txt` to a release that has none, and reports
#     a hard error. Three of the four repositories had this window open.
#   - Every signature is verified before the release is published, with the key a
#     router will use. A secret rotated without the public half being committed
#     otherwise publishes a release that every installer rejects with "BAD
#     SIGNATURE" — indistinguishable from the attack the signature exists to stop.
#
# Usage:
#
#   jobs:
#     gates:                  # your own checks, ordinary jobs
#       ...
#     package:
#       needs: gates
#       permissions:
#         contents: write     # the release job creates the release
#       uses: owfeed/owfeed/.github/workflows/package.yml@v0.5.0
#       secrets:
#         sign-key: ${{ secrets.OWFEED_SIGN_KEY }}
#         usign-key: ${{ secrets.OWFEED_RELEASE_KEY }}
#       with:
#         owfeed-version: v0.5.0
#         stage: npm ci --ignore-scripts && ./tools/stage.sh
#
# THERE IS NO SMOKE STEP HERE, and that is doctrine rather than an omission.
# `owfeed smoke` asks whether a FEED installs without --allow-untrusted, and an author
# publishing release assets has no feed to ask about. The question an author wants —
# does the package work on a real router — is owlab's, and it belongs in a job of the
# caller's own, where no key exists:
#
#     - uses: owfeed/owlab/action@v0.5.1
#       with: { releases: "25.12.5", install: dist/noarch/*.apk, assert: ... }
#
# The setup action is referenced by exact tag rather than a floating major, so pinning
# this workflow pins everything it runs.

on:
  workflow_call:
    inputs:
      owfeed-version:
        description: owfeed release tag to install. Pin it.
        required: true
        type: string
      stage:
        description: >-
          Shell that produces the tree owfeed packages, run in the job that has no
          key. This is the half owfeed deliberately does not do: it packages a
          directory, it does not build one.
        required: false
        type: string
        default: ""
      sign-also:
        description: >-
          Extra files to sign with the release key, space separated, resolved inside
          dist/. An installer fetched by `curl | sh` belongs here: it is not a package
          and has no place in the manifest's inventory, but it is executable code
          handed to root, and a careful admin can verify it out of band.
        required: false
        type: string
        default: ""
      pre-release:
        description: >-
          Shell run in the release job after the packages are downloaded and before
          anything is signed. Anything that has to be an asset and is not a package —
          release notes cut from a CHANGELOG, an installer — is written into dist/
          here, so it is covered by the same signing pass.
        required: false
        type: string
        default: ""
      notes-file:
        description: Path to a file whose contents become the release body.
        required: false
        type: string
        default: ""
      verify-with:
        description: >-
          Path to the usign PUBLIC key committed in the repository. Every signature is
          checked against it before the release is published — which catches a secret
          rotated without the public half being updated, where the symptom is
          otherwise indistinguishable from tampering.
        required: false
        type: string
        default: ""
      source-date-epoch:
        description: >-
          Fixed build timestamp. Empty means the timestamp of the commit being built,
          which is the right default for a package repository: identity should depend
          on what went into the package and nothing else, so re-running a release over
          the same commit produces the same bytes.
        required: false
        type: string
        default: ""
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      sign-key:
        description: >-
          EC prime256v1 SEC1 PEM. Its signature goes inside the .apk and travels to
          the router; apk signature blocks are additive, so a feed that re-signs the
          package adds its own beside this one.
        required: false
      usign-key:
        description: >-
          usign secret key. Signs manifest.txt — the inventory of the whole release,
          which the per-package signatures cannot cover. usign because it is the
          scheme OpenWrt already ships, so a router verifies it with nothing
          installed, and opkg cannot verify a standalone .ipk at all.
        required: false
    outputs:
      version:
        description: The version that was built, as `owfeed plan` resolved it.
        value: ${{ jobs.build.outputs.version }}
      released:
        description: '"true" when a release was published.'
        value: ${{ jobs.release.outputs.released || 'false' }}

permissions:
  contents: read

jobs:
  # No key, deliberately: this job runs the caller's build script, and on a pull
  # request that script came out of a fork.
  build:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `version-from: tag` reads the tag, and a shallow checkout has none.
          fetch-depth: 0

      - uses: owfeed/owfeed/setup@v0.4.5
        with:
          version: ${{ inputs.owfeed-version }}

      - name: Resolve the build epoch
        env:
          FIXED: ${{ inputs.source-date-epoch }}
        run: echo "SOURCE_DATE_EPOCH=${FIXED:-$(git log -1 --format=%ct)}" >> "$GITHUB_ENV"

      # Through env, never interpolated into `run:`. A caller that passed a branch
      # name into this input would otherwise be handing whoever wrote it a shell.
      - if: inputs.stage != ''
        env:
          SCRIPT: ${{ inputs.stage }}
        run: bash -euo pipefail -c "$SCRIPT"

      # What is about to be built, named before it exists. The release job reads the
      # version from here rather than deriving it a second time.
      - id: plan
        run: |
          owfeed plan
          v=$(owfeed plan --json | jq -r '.packages[0].version')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Everything that can be checked without a key: build, sign, index and doctor
      # on keys owfeed generates and throws away. It leaves dist/ untouched.
      - run: owfeed check

      - run: owfeed build

      # dist/root and dist/scripts are staging, not output: uploading them would put
      # the whole payload tree into an artifact the release job then globs.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owfeed-packages
          path: |
            dist/*/*.apk
            dist/*/*.ipk
          if-no-files-found: error
          retention-days: 1

  # The only job that holds a key, and it exists only for a tag.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
    outputs:
      released: ${{ steps.publish.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: owfeed/owfeed/setup@v0.4.5
        with:
          version: ${{ inputs.owfeed-version }}

      # merge-multiple flattens the artifact's own wrapper away and leaves what is
      # inside it alone, so dist/noarch and dist/all arrive intact — the layout
      # `owfeed release` walks.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: owfeed-packages
          path: dist
          merge-multiple: true

      # Through env, never interpolated into `run:` — the same rule as `stage:`.
      - if: inputs.pre-release != ''
        env:
          SCRIPT: ${{ inputs.pre-release }}
        run: bash -euo pipefail -c "$SCRIPT"

      - name: Sign the packages
        env:
          OWFEED_SIGN_KEY: ${{ secrets.sign-key }}
        run: |
          set -euo pipefail
          [ -n "${OWFEED_SIGN_KEY:-}" ] || {
            echo "no sign-key: the published package would carry no evidence of who"
            echo "built it, and no feed will carry it. Pass secrets.sign-key."
            exit 1
          }
          owfeed sign

      # `--repo` is written into the manifest and readers check it against where they
      # fetched it from: a signature proves who wrote a file and never what it is
      # about, so without that line a manifest lifted from another of the author's
      # releases verifies perfectly under this one's name.
      - name: Write and sign the manifest
        env:
          OWFEED_RELEASE_KEY: ${{ secrets.usign-key }}
          ALSO: ${{ inputs.sign-also }}
        run: |
          set -euo pipefail
          [ -n "${OWFEED_RELEASE_KEY:-}" ] || {
            echo "no usign-key: a release without a signed manifest is one no feed can"
            echo "ingest. Pass secrets.usign-key."
            exit 1
          }
          args=""
          for f in $ALSO; do args="$args --sign-also $f"; done
          # shellcheck disable=SC2086
          owfeed release --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" $args
          cat dist/manifest.txt

      # Release assets are flat, and owfeed leaves packages under a directory per
      # architecture because apk derives a filename from name and version alone. The
      # manifest names files without paths, which is what a router asks for, so
      # flattening is what makes the manifest and the release page agree.
      - name: Flatten
        run: |
          set -euo pipefail
          for f in dist/*/*.apk dist/*/*.ipk dist/*/*.sig; do
            [ -e "$f" ] || continue
            mv "$f" dist/
          done
          rmdir dist/*/ 2>/dev/null || true
          ls -l dist

      - name: Verify every signature with the key a router will use
        if: inputs.verify-with != ''
        env:
          PUB: ${{ inputs.verify-with }}
        run: |
          set -euo pipefail
          n=0
          for p in dist/*.apk dist/*.ipk dist/manifest.txt; do
            [ -e "$p" ] || continue
            [ -s "$p.sig" ] || { echo "no signature for $(basename "$p")"; exit 1; }
            owfeed verify-artifact --key "$PUB" --signature "$p.sig" "$p"
            echo "verified: $(basename "$p")"
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "nothing was verified — the glob found no packages"; exit 1; }

      # A DRAFT, flipped in the next step. See the note at the top of this file: the
      # window between "release exists" and "assets attached" is one a router can fall
      # into, and `latest` does not resolve to a draft.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          body_path: ${{ inputs.notes-file }}
          draft: true

      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
          echo "released=true" >> "$GITHUB_OUTPUT"

      # The last moment this is a red build rather than a bug report. A router fetches
      # the manifest from the release CDN, not the API, and a 404 here means every
      # install and every update check would have failed.
      - name: The manifest resolves through latest/download
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/manifest.txt"
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 2 -o "$RUNNER_TEMP/mf" "$url" && break
            [ "$i" = 5 ] && { echo "$url does not resolve"; exit 1; }
            sleep 5
          done
          diff -u dist/manifest.txt "$RUNNER_TEMP/mf" || {
            echo "the manifest served by latest/download is not the one just built"; exit 1; }
          echo "manifest.txt resolves and matches."
